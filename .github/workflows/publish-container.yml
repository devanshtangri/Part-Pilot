name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'devanshtangri/Part-Pilot'
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate application image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devanshtangri/part-pilot
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish corresponding-source image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./third_party/Dockerfile.sources
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/devanshtangri/part-pilot-source:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Build and publish multi-platform application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
