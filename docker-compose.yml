services:
  partpilot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: partpilot
    env_file:
      - .env
    environment:
      PARTPILOT_DATABASE_URL: sqlite:////data/partpilot.db
      PARTPILOT_ENABLE_DEBUG_RESET: "${PARTPILOT_ENABLE_DEBUG_RESET:-true}"
      PARTPILOT_RESTORE_SUPERVISOR_CONTRACT: "compose-restart-v1"
    ports:
      # PARTPILOT:FIXED_CONTAINER_PORT_MAPPING:V812
      # Part Pilot listens on fixed container port 8000. Change only host-side 7890 if desired.
      - "${PARTPILOT_BIND_ADDRESS:-0.0.0.0}:7890:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/ready',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
